- id: dynamo-paper
  title: "Dynamo: Amazon's Highly Available Key-value Store"
  url: https://www.allthingsdistributed.com/files/amazon-dynamo-sosp2007.pdf
  type: paper
  note: >-
    The SOSP 2007 paper behind eventual consistency, consistent hashing, and
    hinted handoff. Foundational reading for distributed systems.
  tags: [distributed-systems, databases]
  added: 2026-07-15

- id: the-bitter-lesson
  title: "The Bitter Lesson"
  url: http://www.incompleteideas.net/IncIdeas/BitterLesson.html
  type: article
  note: >-
    Rich Sutton's short, oft-cited essay arguing that general methods leveraging
    computation beat hand-crafted domain knowledge in the long run.
  tags: [ml, essays]

- id: julia-evans-blog
  title: Julia Evans — blog & zines
  url: https://jvns.ca
  type: article

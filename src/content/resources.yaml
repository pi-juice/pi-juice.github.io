- id: compiler-explorer
  title: Compiler Explorer (Godbolt)
  url: https://godbolt.org
  type: tool
  note: >-
    See the assembly your C/C++/Rust/etc. compiles to, live, across compilers
    and flags. Indispensable for understanding what the optimizer does.
  tags: [compilers, performance]

- id: regex101
  title: regex101
  url: https://regex101.com
  type: tool
  note: >-
    Build and debug regular expressions with a live match explanation and a
    reference sidebar. Supports multiple regex flavors.
  tags: [regex]

- id: papers-with-code
  title: Papers with Code
  url: https://paperswithcode.com
  type: other

- id: attention-is-all-you-need
  title: "Attention Is All You Need"
  url: https://arxiv.org/abs/1706.03762
  type: paper
  note: >-
    The 2017 paper that introduced the Transformer and kicked off the modern
    era of large language models. Worth reading the original.
  tags: [ml, transformers]
  added: 2026-07-20

- id: what-every-programmer-should-know-about-memory
  title: "What Every Programmer Should Know About Memory"
  url: https://people.freebsd.org/~lstewart/articles/cpumemory.pdf
  type: article
  note: >-
    Ulrich Drepper's long-form walk through caches, TLBs, and memory access
    patterns. Dense, but it reshapes how you think about performance.
  tags: [systems, performance]

